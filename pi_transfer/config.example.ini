; Copy to config.ini and edit. No passwords in this file - see README.

[paths]
; EXISTING folders - used exactly as the old script used them.
; Producers drop *.json here; files leave it only after they are confirmed sent.
inbox_dir = C:\PI_MISMATCH_TOOL
; NEW folder (created automatically): logs, status, archive backlog.
; Keep it on the same drive as inbox_dir.
state_dir = C:\PI_MISMATCH_TOOL_STATE
; EXISTING folder: sent files end up here, as before. Use a UNC path (\\server\share\...) if E: is a
; mapped network drive - services cannot see drives mapped in a user session.
archive_dir = E:\SharePoint_PI_Mismatch_Tool\Out
; Optional: HEALTH.txt / health.json copied here. Off by default.
; If you use it, point it at a NEW folder, not one of the existing ones.
publish_dir =

[timing]
poll_seconds = 5
; A file must be unchanged for this long before it is picked up.
settle_seconds = 5
; Retry backoff: 5s, 10s, 20s ... up to this cap. Retries never stop.
max_retry_delay_seconds = 300
; If the main loop makes no progress for this long, the process exits and the service restarts it.
hang_timeout_seconds = 900

[sftp]
host = SFTP_HOST_OR_IP
port = 22
username = SFTP_USERNAME
; Recommended: SSH key auth. Leave empty to use a password from
; Windows Credential Manager (keyring) or the PI_SFTP_PASSWORD variable.
key_file = C:\PI_Transfer\keys\id_ed25519
; EXISTING remote folder: receives <name>.json only, as before.
remote_dir = /project/PI_MISMATCH_TOOL/requests
; Optional, off by default. Set to a NEW remote folder on the same filesystem
; (e.g. /project/PI_MISMATCH_TOOL/staging, created by the server admin) to
; upload there first and then rename into remote_dir, so the consumer can
; never read a half-uploaded file. Empty = upload directly, like the old script.
remote_staging_dir =
connect_timeout_seconds = 20
io_timeout_seconds = 120
; true = also compare SHA-256 using the remote 'sha256sum' (needs shell access for the user).
verify_remote_sha256 = false

[validation]
; true = invalid JSON is NOT sent; it stays in the inbox (untouched) and an alert is raised.
; false = send everything, exactly like the old script.
validate_json = true

[health]
service_name = PITransferService
heartbeat_stale_seconds = 300
; Alert when a file has been waiting in the inbox longer than this.
backlog_alert_seconds = 900
archive_backlog_alert_seconds = 3600
alert_repeat_seconds = 3600
restart_service_if_stale = true
; Teams: channel -> Workflows -> "Post to a channel when a webhook request is received".
; Can also be supplied via the PI_ALERT_WEBHOOK_URL environment variable.
webhook_url =
; teams | generic
webhook_kind = teams
event_log_source = PI_Mismatch_Transfer
